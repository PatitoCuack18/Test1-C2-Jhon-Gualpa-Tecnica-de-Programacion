<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Ventas por Categoría en Tienda de Abarrotes</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th colspan="2">Ventas abarrotes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="2" align="center">
                    <button id="id-btn-cargar-Num">Cargar Numeros</button>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="id-btn-presentar-Num">Presentar Numeros</button>
                </td>
                <td>
                    <textarea name="" id="id-listado-num" rows="3" readonly>
                    </textarea>
                </td>
            </tr>
        </tbody>
        <tfoot></tfoot>
    </table>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
